[project]
name = "fibmind"
version = "0.1.0"
description = "FibBrain, a cognitive runtime for agents, backed by the FibMind memory engine."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "FibMind Prototype" }
]
dependencies = [
    "mcp>=2,<3",
]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
fibmind-mcp = "fibmind.mcp_server:main"
fibbrain-mcp = "fibmind.mcp_server:main"
fibmind-migrate = "fibmind.migrate:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
