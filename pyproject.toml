[project]
name = "fibmind"
version = "0.1.0"
description = "FibBrain, a cognitive runtime for agents, backed by the FibMind memory engine."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "FibMind Prototype" }
]
dependencies = [
    "mcp>=2,<3",
]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
fibmind-mcp = "fibmind.mcp_server:main"
fibbrain-mcp = "fibmind.mcp_server:main"
fibmind-migrate = "fibmind.migrate:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "evals", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Long literal strings (regexes, fixtures) are left to the formatter's judgement.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# examples put src/ on sys.path before importing the package
"examples/*.py" = ["E402"]
