[project]
name = "fibmind"
version = "0.1.0"
description = "FibBrain, a cognitive runtime for agents, backed by the FibMind memory engine."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "jiemoxiaolong" }
]
keywords = ["agent", "memory", "mcp", "llm", "long-term-memory", "event-sourcing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
    "mcp>=2,<3",
]

[project.urls]
Homepage = "https://github.com/Engine-AI/fibmind"
Repository = "https://github.com/Engine-AI/fibmind"
Issues = "https://github.com/Engine-AI/fibmind/issues"
Documentation = "https://github.com/Engine-AI/fibmind#readme"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
fibmind-mcp = "fibmind.mcp_server:main"
fibbrain-mcp = "fibmind.mcp_server:main"
fibmind-daemon = "fibmind.mcp_server:daemon_main"
fibmind-migrate = "fibmind.migrate:main"
fibmind-verify = "fibmind.verify:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fibmind = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "evals", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Long literal strings (regexes, fixtures) are left to the formatter's judgement.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# examples put src/ on sys.path before importing the package
"examples/*.py" = ["E402"]
