name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra dev
      - run: uv run ruff check src tests evals examples
      - run: uv run ruff format --check src tests evals examples
      - run: uv run pytest -q
      # The evaluation suite is a merge gate, not a report: it must not fall
      # below evals/floor.json.
      - run: uv run python -m evals.gate

  dsh-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/dsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test
